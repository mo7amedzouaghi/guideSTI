name: Application Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compiler l'application
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../sortie
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            export ANDROID_KEYSTORE_PATH="$PWD/cle/guidesti-envoi.p12"
            gradle assembleRelease bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../sortie/GuideSTI.apk
            cp app/build/outputs/bundle/release/app-release.aab ../sortie/GuideSTI-GooglePlay.aab
          else
            echo "::warning::Secret ANDROID_KEYSTORE_PASSWORD absent : APK de test seulement (non publiable sur Google Play)."
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../sortie/GuideSTI.apk
          fi
          ls -la ../sortie

      - uses: actions/upload-artifact@v4
        with:
          name: GuideSTI-android
          path: sortie/

      - name: Publier la version (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Guide STI Android 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Application Android du Guide STI (espace élèves et enseignants).
            - GuideSTI.apk : à installer directement sur un téléphone Android.
            - GuideSTI-GooglePlay.aab : fichier à envoyer dans la Google Play Console (présent seulement si la clé de signature est configurée).
          files: sortie/*
