<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription à un stage</title>
    <link rel="stylesheet" href="style.css">
    <script src="stage.js"></script>
</head>
<body onload="genererCaptcha()">
    <h1>Inscription à un stage d'été</h1>
    <form name="f">
        <fieldset>
            <legend>Identité</legend>
            <label for="nom">Nom :</label>
            <input type="text" id="nom"><br>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom"><br>
            <label for="dn">Date de naissance :</label>
            <input type="date" id="dn">
        </fieldset>

        <fieldset>
            <legend>Stage</legend>
            <label for="spec">Spécialité :</label>
            <select id="spec">
                <option>-- Choisir --</option>
                <option>Développement web</option>
                <option>Réseaux</option>
                <option>Bases de données</option>
            </select><br>
            <label for="ville">Ville :</label>
            <input type="text" id="ville" list="villes">
            <datalist id="villes">
                <option value="Tunis">
                <option value="Manouba">
                <option value="Ariana">
                <option value="Sousse">
                <option value="Sfax">
            </datalist><br>
            <label for="duree">Durée (semaines) :</label>
            <input type="range" id="duree" min="1" max="8" value="4" oninput="afficherDuree()">
            <output id="aff">4</output><br>
            Niveau :
            <input type="radio" name="niv" id="n1" value="Débutant"><label for="n1">Débutant</label>
            <input type="radio" name="niv" id="n2" value="Intermédiaire"><label for="n2">Intermédiaire</label>
            <input type="radio" name="niv" id="n3" value="Avancé"><label for="n3">Avancé</label>
        </fieldset>

        <fieldset>
            <legend>Vérification</legend>
            Code : <span id="code"></span><br>
            <label for="cap">Recopier le code :</label>
            <input type="text" id="cap" maxlength="5">
        </fieldset>

        <input type="button" value="Valider" onclick="verifier()">
    </form>
    <p id="resultat"></p>
</body>
</html>
